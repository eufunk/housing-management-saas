services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
        environment:
            DB_HOST: pgsql
            REDIS_HOST: redis
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - propertymanager

    nginx:
        image: nginx:alpine
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - propertymanager

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan queue:work --tries=3 --sleep=3
        volumes:
            - .:/var/www/html
        environment:
            DB_HOST: pgsql
            REDIS_HOST: redis
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - propertymanager

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan schedule:work
        volumes:
            - .:/var/www/html
        environment:
            DB_HOST: pgsql
            REDIS_HOST: redis
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - propertymanager

    node:
        image: node:22-alpine
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host"
        ports:
            - '5173:5173'
        volumes:
            - .:/var/www/html
        networks:
            - propertymanager

    pgsql:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-housing_management_saas}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            - pgsql_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - propertymanager

    redis:
        image: redis:7-alpine
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - propertymanager

networks:
    propertymanager:
        driver: bridge

volumes:
    pgsql_data:
        driver: local
    redis_data:
        driver: local
