server {
    # Render's Web Services default to PORT=10000 for Docker deployments.
    # Render docs: https://render.com/docs/web-services (Port binding)
    listen 10000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # php-fpm runs in the same container (no sibling "app" service here,
        # unlike docker/nginx/default.conf which talks to a separate one).
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
